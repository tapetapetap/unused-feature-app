[versions]
agp = "8.8.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"
junit = "4.13.2"
pleosVehicle = "2.3.2"
pleosVehicleData = "1.1.11"
pleosTts = "3.3.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "pleosVehicle" }
pleos-vehicle-data = { group = "ai.pleos.playground", name = "vehicle-data", version.ref = "pleosVehicleData" }
pleos-tts = { group = "ai.pleos.playground", name = "TextToSpeech", version.ref = "pleosTts" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
